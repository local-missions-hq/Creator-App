services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: local_missions
      POSTGRES_PASSWORD: local_missions_local_only
      POSTGRES_USER: local_missions
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U local_missions -d local_missions']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - local_missions_postgres:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - '127.0.0.1:10000:10000'
      - '127.0.0.1:10001:10001'
      - '127.0.0.1:10002:10002'
    volumes:
      - local_missions_azurite:/data

volumes:
  local_missions_azurite:
  local_missions_postgres:
