name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node scripts/validate-azure-workload-preplan-revalidation.mjs
      - run: node scripts/validate-azure-workload-provider-registration-gate.mjs
      - run: node scripts/validate-azure-workload-provider-registration-tool.mjs
      - run: node scripts/validate-azure-retained-state-recovery-gate.mjs
      - run: node scripts/review-azure-retained-state-recovery-plan.mjs
      - run: pnpm test:security
